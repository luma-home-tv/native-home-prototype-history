[package]
name = "native_home"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Isolated native webOS Home client built on PlxNative's shared UI"

[workspace]

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
plx_ui = { path = "../../rust-modules/ui" }
plx_gfx = { path = "../../rust-modules/gfx" }
plx_base = { path = "../../rust-modules/base" }
plx_platform = { path = "../../rust-modules/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[features]
hostsim = ["plx_gfx/hostsim", "plx_base/hostsim", "plx_platform/hostsim"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

